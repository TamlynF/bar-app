name: Release unpaid bookings

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: release-unpaid-bookings
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Call release-unpaid endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://bar-app-tau.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 90 \
            -X POST "$SITE_URL/api/bookings/release-unpaid" \
            -H "Authorization: Bearer $CRON_SECRET"
