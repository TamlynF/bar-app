<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline | Don Fenticas</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #F4F1E8; color: #20231A; font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { text-align: center; padding: 32px; max-width: 28rem; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p  { color: #5E6654; margin: 0 0 20px; }
    button { border: 1px solid #34451F; color: #34451F; background: transparent;
             border-radius: 12px; padding: 10px 18px; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Don Fenticas needs a connection to load bookings and events. Check your signal and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
